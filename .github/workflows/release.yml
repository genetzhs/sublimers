name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Build on the oldest supported Ubuntu so the binaries run on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          cargo install cargo-generate-rpm --locked
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Check version matches tag
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Cargo.toml version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Test
        run: cargo test --release --workspace

      - name: Build packages
        env:
          # No FUSE on the runners: let appimagetool unpack itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/build-release.sh ./appimagetool

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Sublimers ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
